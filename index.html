<style>
/* =========================================================================
   ARBA DESTINATION KB — SHARED STYLE (DO NOT EDIT PER DESTINATION)

:root{
  color-scheme: light;
  --ink:#1c1c1c; --muted:#6b6b6b; --line:#e6e6e6; --bg:#ffffff; --soft:#f7f7f7;
  --green:#c8172b; --green2:#e23744; --greend:#a01223; --greensoft:#fdebed;
  --halal:#0a7d63; --star:#c8172b;
  --sea1:#0e5c53; --sea2:#0a7d63;
  --shadow:0 1px 2px rgba(0,0,0,.03),0 3px 12px rgba(0,0,0,.05);
  --shadow-lg:0 10px 30px rgba(0,0,0,.11);
  --r:18px;
}
*{box-sizing:border-box}
html{scroll-padding-top:112px}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Poppins","Trebuchet MS",-apple-system,BlinkMacSystemFont,"Segoe UI",Verdana,Arial,sans-serif;
  font-size:15px;line-height:1.5}
a{color:var(--green)}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 90px}
.topbar{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line)}
.topbar .in{max-width:1080px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:16px}
.logo{white-space:nowrap;display:flex;align-items:center;gap:12px;text-decoration:none}
.brandmark{display:inline-flex;flex-direction:column;align-items:center;line-height:.85;color:var(--green);font-weight:800}
.brandmark>.big{font-size:24px;letter-spacing:.5px}
.brandmark>.sub{font-size:8px;letter-spacing:5px;font-weight:700;margin-top:3px}
.kbtag{font-size:12.5px;color:var(--muted);font-weight:700;border-left:1px solid var(--line);padding-left:12px}
.miniS{flex:1;max-width:520px;margin-left:auto;position:relative}
.miniS input{width:100%;padding:10px 14px 10px 40px;border:1px solid #d9d9d9;border-radius:999px;font-size:14px;outline:none;background:#fff}
.miniS input:focus{border-color:var(--ink);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.miniS .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.hero{position:relative;border-radius:24px;overflow:hidden;margin-top:22px;min-height:340px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow)}
.hero .bg{position:absolute;inset:0;background:linear-gradient(135deg,var(--sea1),var(--sea2))}
.hero .bg img{width:100%;height:100%;object-fit:cover;display:block}

.hero .in{position:relative;color:#fff;padding:46px 22px;width:100%;max-width:640px}
.kicker{font-size:11.5px;letter-spacing:3px;font-weight:800;text-transform:uppercase;opacity:.9;margin-bottom:14px}

.bigsearch{position:relative;background:#fff;border-radius:999px;box-shadow:0 10px 34px rgba(0,0,0,.24);display:flex;align-items:center;padding:6px 6px 6px 20px;max-width:560px;margin:0 auto}

.tcard .body{padding:13px 14px 15px}

  font-weight:800;font-size:13px;padding:8px 16px;border-radius:999px;transition:.14s}

section.block{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-top:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}

mark{background:#fff3ba;padding:0 2px;border-radius:3px}
.badge-halal{display:inline-block;background:#eaf7f0;color:var(--halal);border:1px solid #c7ebda;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}

    "compare": "<h2>Perbezaan Pakej — Private Tour (PT) vs Self Tour (ST)</h2><p class='ssub'>Bantu customer pilih antara dipandu (PT) atau pandu sendiri (ST).</p><table class='cmp'><colgroup><col class='c1'><col><col></colgroup><thead><tr><th class='blank'></th><th>PRIVATE TOUR (PT)</th><th>SELF TOUR (ST)</th></tr></thead><tbody><tr><td class='feat'>Jenis pengalaman</td><td class='val'>Dipandu — driver-cum-guide</td><td class='val'>Pandu sendiri (kereta sewa)</td></tr><tr><td class='feat'>Driver-cum-guide (Melayu/English)</td><td class='val'><span class='tick'>✔</span></td><td class='val'><span class='no'>—</span></td></tr><tr><td class='feat'>Transport</td><td class='val'>Van persendirian + driver</td><td class='val'>MPV sewa + GPS</td></tr><tr><td class='feat'>Airport transfer</td><td class='val'><span class='tick'>✔</span></td><td class='val'><span class='tick'>✔</span></td></tr><tr><td class='feat'>Insurans kereta + roadside 24/7</td><td class='val'><span class='no'>—</span></td><td class='val'><span class='tick'>✔</span></td></tr><tr><td class='feat'>Fuel & parking termasuk</td><td class='val'><span class='tick'>✔</span></td><td class='val'><span class='no'>—</span></td></tr><tr><td class='feat'>Tipping termasuk</td><td class='val'><span class='tick'>✔</span></td><td class='val'><span class='no'>—</span></td></tr><tr><td class='feat'>Welcome Lunch</td><td class='val'><span class='tick'>✔</span></td><td class='val'><span class='no'>—</span></td></tr><tr><td class='feat'>Flight domestik (AKL–CHC & ZQN–AKL)</td><td class='val'><span class='tick'>✔</span></td><td class='val'><span class='tick'>✔</span> (9D8N)</td></tr><tr><td class='feat'>NZeTA application 1x</td><td class='val'><span class='tick'>✔</span></td><td class='val'><span class='tick'>✔</span></td></tr><tr><td class='feat'>Panduan restoran halal</td><td class='val'>Guide bantu</td><td class='val'><span class='tick'>✔</span> (disediakan)</td></tr><tr><td class='feat'>Akomodasi</td><td class='val'>3★ Hotel/Motel</td><td class='val'>3–4★ / Apartment (ada dapur)</td></tr><tr><td class='feat'>Pilihan durasi</td><td class='val'>8–10 hari</td><td class='val'>6–9 hari</td></tr><tr><td class='feat'>Harga from (2 pax)</td><td class='val'>RM 12,997</td><td class='val'>RM 5,197</td></tr><tr><td class='feat'>Paling sesuai untuk</td><td class='val'>Keluarga mahu relax & dipandu</td><td class='val'>Yang suka pandu sendiri & fleksibel</td></tr></tbody></table><div class='custnote'>Harga from ikut pakej termurah setiap kategori (PT South 8D7N · ST North 6D5N). Rujuk tab Harga & Pakej untuk kadar penuh.</div>",

  "snapshot": "# PT New Zealand — Knowledge Base (Important Notes & FAQ)\n\n## 1. IMPORTANT NOTES (Polisi Pakej)\n\n*5 varian: PT North & South 10D9N · PT South 8D7N · ST North & South 9D8N (Standard) · ST North & South 9D8N (Apartment) · ST North Island 6D5N. Semua sah sehingga tempoh perjalanan 31 Mac 2027.*\n\n- Harga sah 24 jam selepas quotation dihantar; itinerari & harga boleh berubah tanpa notis.\n- Deposit RM1,000/pax (RM800 untuk 6D5N) semasa pengesahan; baki penuh 45 hari sebelum berangkat.\n- Late booking surcharge dikenakan jika tempahan kurang 45 hari sebelum berangkat.\n- Harga adalah untuk 2–3 pax sebilik. Single supplement: +RM3,500 (10D9N) / +RM2,500 (8D7N).\n- Nama & lokasi hotel disahkan sekurang-kurangnya 45 hari sebelum berangkat.\n- Disyorkan ambil Malaysia Airlines (MAS) ke Auckland & balik dari Auckland untuk padan itinerari default.\n- Muslim-friendly (halal, surau/masjid) adalah baseline — makanan halal terhad di luar bandar besar, jadi self-catering & bekalan segera sangat digalakkan.\n\n## 3. FAQ\n\n### A. Pakej & Itinerari\n\n**Apa beza pakej PT dan ST?**\nPT (Private Tour) datang dengan transport peribadi + driver-cum-guide yang cakap Melayu/English — customer duduk relax, guide yang pandu & urus. ST (Self Tour/Self Drive) pula customer pandu sendiri kereta sewa MPV (GPS + insurans penuh + bantuan 24/7) mengikut itinerari — lebih fleksibel & jimat.\n\n**Pakej mana paling sesuai untuk first-timer?**\nUntuk pengalaman penuh dua pulau tanpa penat, PT North & South 10D9N. Untuk yang fokus South Island (Milford, Mt Cook, Queenstown), PT South 8D7N. Untuk trip pendek santai, ST North Island 6D5N.\n\n**Berapa kali tukar hotel?**\nSehingga 8 kali untuk pakej 10D9N — sebab itu pack ringan (maksimum 1 beg/pax). Ini normal untuk road trip menyeluruh di NZ.\n\n**Kenapa ada pemanduan lama?**\nNZ luas & bergunung; sesetengah lokasi ambil 4–5 jam perjalanan. Toilet & coffee break diselang. Ikut nasihat driver-guide tentang timing sebab jalan kadang ditutup (road closure).\n\n### B. Halal, Makanan & Solat\n\n**Senang dapat makanan halal di New Zealand?**\nNZ ialah antara pengeksport daging halal terbesar dunia, jadi daging lembu & kambing halal ada di kebanyakan pasar raya. Auckland ada 70+ restoran halal; Christchurch pun ada pilihan. Tetapi di luar bandar (Twizel, Te Anau, Queenstown, Mt Cook) pilihan sangat terhad — bawa bekalan segera & rancang awal. ST disertakan panduan restoran halal.\n\n**Boleh masak sendiri?**\nYa — inilah kelebihan pakej ST Apartment 9D8N: apartment/Airbnb ada dapur untuk masak makanan halal sendiri. Beli daging halal & salmon segar (High Country Salmon Farm) di pasar raya.\n\n**Ada masjid atau surau untuk solat?**\nNZ ada ~60 masjid & pusat Islam. Masjid An Noor (Al Noor) di Christchurch ada dalam itinerari — kemudahan penuh & komuniti mesra. Auckland ada belasan masjid. Di kawasan luar bandar & Queenstown tiada masjid besar; bawa sejadah/telekung & solat di hotel, kereta atau kawasan rehat.\n\n**Macam mana nak solat masa road trip panjang?**\nMusafir boleh jamak & qasar. Rancang waktu solat mengikut perhentian rehat; driver-guide (PT) boleh bantu cari tempat sesuai. Bawa sejadah kecil & kompas kiblat (atau app).\n\n### C. Visa & Passport\n\n**Perlu visa ke New Zealand?**\nWarga Malaysia tidak perlu visa — tetapi wajib ada NZeTA (Electronic Travel Authority) sebelum berlepas. Boleh tinggal sehingga 90 hari.\n\n**Berapa kos & berapa lama NZeTA sah?**\nNZeTA ~NZD17 (app) atau NZD23 (web) + International Visitor Levy (IVL) NZD100. Sah 2 tahun (multiple entry, setiap lawatan maksimum 90 hari). Kelulusan ambil sehingga 72 jam — mohon awal.\n\n**NZeTA termasuk dalam pakej?**\nYa — application NZeTA pertama percuma 1x untuk warga Malaysia. Re-application atau warga bukan Malaysia tidak termasuk.\n\n### D. Flight & Airport\n\n**Ada flight terus dari KUL ke Auckland?**\nYa — Malaysia Airlines (MAS) satu-satunya penerbangan terus KUL–AKL, ~10 jam 25 minit. Disyorkan ambil MAS untuk padan itinerari (tiba & balik dari Auckland).\n\n**Flight antarabangsa termasuk?**\nTidak — flight antarabangsa KUL–AKL–KUL tidak termasuk dalam mana-mana pakej. Flight domestik (AKL–CHC & ZQN–AKL) termasuk dalam pakej North & South + bagasi 20kg.\n\n**6D5N North Island ada flight domestik?**\nTidak — pakej North Island sahaja, jadi tiada flight domestik. Mula & tamat di Auckland.\n\n### E. Hotel & Bilik\n\n**Hotel jenis apa digunakan?**\nPT & ST Standard: hotel/motel 3★ (sesetengah lokasi 3–4★). ST Apartment 9D8N: apartment/Airbnb dengan dapur. Naik taraf 4★ boleh atas permintaan (surcharge).\n\n**Bila nama hotel disahkan?**\nSekurang-kurangnya 45 hari sebelum berangkat.\n\n**Ada deposit di hotel?**\nYa, sesetengah hotel minta deposit keselamatan yang boleh dikembalikan (refundable) semasa check-in, dibayar dengan kad kredit/debit.\n\n### F. Cuaca & Musim\n\n**Bila musim terbaik ke New Zealand?**\nDis–Feb (panas, 20–25°C) untuk cuaca terbaik & semua aktiviti buka — tetapi musim puncak (surcharge & perlu book awal). Mac–Mei (luruh) paling fotogenik untuk Milford Sound, kurang orang & value lebih baik. Jun–Ogos sejuk dengan salji alpine yang dramatik.\n\n**Sejuk ke di South Island?**\nYa — cuaca 4 musim & bertentangan Malaysia. South Island (Mt Cook, Tekapo, Milford) boleh sangat sejuk terutama musim sejuk & waktu malam. Pakai pakaian berlapis sepanjang tahun.\n\n**Air terjun Milford bila paling deras?**\nMusim bunga (Sep–Nov) & selepas hujan — air terjun paling banyak & deras.\n\n### G. Shopping & Duit\n\n**Guna duit apa?**\nNew Zealand Dollar (NZD). Kad kredit/debit diterima hampir di mana-mana; bawa sedikit tunai untuk pekan kecil.\n\n**Beli apa untuk oleh-oleh?**\nMadu Manuka, produk bulu biri-biri (merino), coklat, salmon, & cenderahati Maori. Souvenir shopping ada di Te Anau, Queenstown & Christchurch.\n\n### H. Payment & Refund\n\n**Berapa deposit & bila bayar penuh?**\nDeposit RM1,000/pax (RM800 untuk 6D5N) semasa pengesahan; baki penuh 45 hari sebelum berangkat.\n\n**Harga sah berapa lama?**\nHarga quotation sah 24 jam. Itinerari & harga boleh berubah tanpa notis sehingga disahkan.\n\n### I. Add-ons & Customization\n\n**Aktiviti apa boleh tambah?**\nHobbiton (RM320), Milford Sound Cruise (RM450 / coach+cruise RM650), Skyline Gondola (RM180), Shotover Jet (RM480), Whakarewarewa Maori Village (RM150), Agrodome, Hamilton Garden, fruit picking & lain-lain. Lihat tab Simple Customisation untuk senarai penuh & harga.\n\n**Milford Sound Cruise wajib?**\nIa optional/add-on tetapi sangat disyorkan — ia highlight utama trip. Pilih tiket cruise sahaja atau pakej coach + cruise.\n\n### J. Kesihatan & Keselamatan\n\n**New Zealand selamat untuk pelancong Muslim?**\nYa — NZ mesra & selamat, dengan komuniti Muslim yang aktif terutama selepas Christchurch. Layanan mesra terhadap pelawat.\n\n**Perlu insurans perjalanan?**\nSangat disyorkan (tidak termasuk dalam pakej). Aktiviti alpine & road trip jauh — insurans melindungi kecemasan perubatan & pembatalan.\n\n### K. Praktikal (SIM, Socket, Toilet)\n\n**Socket & voltan?**\nNZ guna plug Type I (sama seperti Australia), 230V. Bawa adapter universal.\n\n**Internet / SIM?**\nPocket wifi & SIM tempatan tidak termasuk — beli SIM prepaid (One NZ / Spark / 2degrees) di airport, atau eSIM sebelum berangkat.\n\n**Toilet masa road trip?**\nToilet awam bersih ada di i-SITE, taman negara & pekan. Driver-guide selang toilet break; rancang sebab jarak antara lokasi jauh.\n\n### L. Packing\n\n**Apa perlu bawa?**\nPakaian berlapis (baju sejuk, jaket kalis air), kasut selesa untuk trek (Hooker Valley), sejadah & telekung, ubat peribadi, adapter, & bekalan makanan segera halal. Pack ringan — maksimum 1 beg/pax kerana kerap tukar hotel.\n\n**Perlu kasut khas untuk trek?**\nUntuk Hooker Valley Track & jalan alpine, kasut sukan/hiking yang selesa & kalis air disyorkan.\n"
}
</script>

function parse(md){const lines=unescapeMd(md).split(/\r?\n/);const secs=[];let cur=null,subs=null,i=0;

    if(/^##\s+/.test(ln)){const title=ln.replace(/^##\s+/,"").trim();cur={title,id:slug(title),type:/FAQ/i.test(title)?"faq":"info",intro:[],cats:[]};secs.push(cur);subs=null;i++;continue;}

      if(cur.type==="faq"&&/^###\s+/.test(ln)){subs={title:ln.replace(/^###\s+/,"").trim(),qas:[]};subs.id=slug(subs.title);cur.cats.push(subs);i++;continue;}
      if(cur.type==="faq"&&subs){const m=ln.match(/^\*\*(.+?)\*\*\s*$/);
        if(m){const q=m[1];const body=[];i++;while(i<lines.length&&!/^\*\*(.+?)\*\*\s*$/.test(lines[i])&&!/^###\s+/.test(lines[i])&&!/^##\s+/.test(lines[i])){body.push(lines[i]);i++;}subs.qas.push({q,body});continue;}
        i++;continue;}
      cur.intro.push(ln);i++;continue;}
    i++;}
  return secs;}

/* topics: fixed order. blocks (pricing/custom/surcharge/transport/stay) come from KB.blocks */
const TOPICS=[
 {id:"compare",t:"Perbezaan Pakej"},{id:"itin",t:"Itinerary & Aktiviti"},{id:"pricing",t:"Harga & Pakej"},{id:"custom",t:"Simple Customisation"},
 {id:"surcharge",t:"Surcharge"},{id:"transport",t:"Transportation & Guide"},{id:"stay",t:"Accommodation"},
 {id:"food",t:"Halal & Makanan"},{id:"flight",t:"Flight & Airport"},{id:"prayer",t:"Solat"},
 {id:"weather",t:"Cuaca & Musim"},{id:"tips",t:"Shopping & Tips"},{id:"visa",t:"Visa & Passport"},
 {id:"freegift",t:"Free Gift (Promo)"},{id:"polisi",t:"Polisi & Payment"},
];
const CATMAP={a:"itin",i:"custom",e:"stay",d:"flight",f:"weather",g:"tips",j:"tips",k:"tips",l:"tips",c:"visa",h:"polisi"};
const PRAYER_RE=/solat|masjid|surau|qiblat|subuh|sembahyang|telekung|sejadah/i;
function topicOf(letter,q,body){letter=(letter||"").toLowerCase();
  if(letter==="b")return PRAYER_RE.test((q||"")+" "+(body||[]).join(" "))?"prayer":"food";
  return CATMAP[letter]||"itin";}
function infoHtml(s){
  const body=s.intro.slice();let sub=null;
  for(let k=0;k<body.length;k++){if(/^\*[^*].*\*$/.test(body[k].trim())){sub=body[k].trim().replace(/^\*|\*$/g,"");body.splice(k,1);break;}}
  let html=sub?"<div class='subtitle'>"+esc(sub)+"</div>":"";let i=0;
  while(i<body.length){let ln=body[i];
    if(/^\s*[-*]\s+/.test(ln)){let it=[];while(i<body.length&&/^\s*[-*]\s+/.test(body[i])){it.push(body[i].replace(/^\s*[-*]\s+/,""));i++;}html+="<ul class='klist'>"+it.map(x=>"<li>"+inline(x)+"</li>").join("")+"</ul>";continue;}
    if(/^\s*\|.*\|\s*$/.test(ln)){let t=[];while(i<body.length&&/^\s*\|.*\|\s*$/.test(body[i])){t.push(body[i]);i++;}html+=renderTable(t);continue;}
    if(ln.trim())html+="<p>"+inline(ln.trim())+"</p>";i++;}
  return html;}
let CURRENT="all";

function renderHotels(){
  if(!KB.hotels||!KB.hotels.length)return"";
  return '<div class="hotels">'+KB.hotels.map(function(ht){var em=ht.emoji||String.fromCodePoint(0x1F3E8);var ph=ht.img?('<img src="'+W(ht.img)+'" alt="'+esc(ht.name)+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.textContent=\''+em+'\'">'):em;return '<div class="hcard"><div class="ph">'+ph+'</div><div class="hb"><div class="tier">'+esc(ht.tier)+'</div><div class="hn">'+esc(ht.name)+'</div><div class="hnote">'+esc(ht.note||"")+'</div></div></div>';}).join("")+'</div>';
}
function renderActs(){
  if(!KB.actGroups||!KB.actGroups.length)return"";
  return KB.actGroups.map(g=>'<h3 class="actcity">'+esc(g.city)+'</h3><div class="actgrid">'+g.items.map(function(it){var n=(typeof it==="string")?it:it.n;var im=(it&&it.img)?it.img:"";var pin=String.fromCodePoint(0x1F4CD);var inner=im?('<img src="'+W(im)+'" alt="'+esc(n)+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.textContent=String.fromCodePoint(0x1F4CD)">'):pin;return '<div class="actcard"><div class="actim">'+inner+'</div><div class="actname">'+esc(n)+'</div></div>';}).join('')+'</div>').join('');
}

function build(md){
  const secs=parse(md);const cont=$("#content");cont.innerHTML="";
  const info={},qs={};TOPICS.forEach(t=>qs[t.id]=[]);
  secs.forEach(s=>{
    if(s.type==="info"){info["polisi"]=(info["polisi"]||"")+"<div class='infosub'>"+esc(s.title.replace(/^\d+\.\s*/,""))+"</div>"+infoHtml(s);}
    else{s.cats.forEach(cat=>{const letter=(cat.title.match(/^([A-Z])\./)||[])[1];cat.qas.forEach(qa=>{qs[topicOf(letter,qa.q,qa.body)].push(qa);});});}
  });
  TOPICS.forEach(tp=>{
    if(!qs[tp.id].length && !info[tp.id])return;
    const sec=document.createElement("section");sec.className="block hidden";sec.dataset.topic=tp.id;sec.id="topic-"+tp.id;
    sec.innerHTML="<h2>"+esc(tp.t)+"</h2>"+(info[tp.id]||"");
    qs[tp.id].forEach(qa=>{const halal=HALAL_RE.test(qa.q+" "+qa.body.join(" "));
      const d=document.createElement("details");d.className="qa";d.dataset.text=(qa.q+" "+qa.body.join(" ")).toLowerCase();
      d.innerHTML="<summary><span class='tw'>▶</span><span>"+inline(qa.q)+(halal?"<span class='badge-halal'>halal/solat</span>":"")+"</span></summary><div class='ans'>"+renderBody(qa.body)+"</div>";
      sec.appendChild(d);});
    cont.appendChild(sec);
  });
  const B=KB.blocks||{};
  [["compare",B.compare],["pricing",B.pricing],["custom",B.custom],["surcharge",B.surcharge],["transport",B.transport],["stay",B.stay],["freegift",B.freegift]].forEach(function(b){
    if(!b[1])return;
    const existing=document.querySelector('.block[data-topic="'+b[0]+'"]');
    if(existing){existing.insertAdjacentHTML("beforeend",b[1].replace(/^\s*<h2>[\s\S]*?<\/h2>/,""));}
    else{const s=document.createElement("section");s.className="block hidden";s.dataset.topic=b[0];s.id="topic-"+b[0];s.innerHTML=b[1];cont.appendChild(s);}
  });
  var _stay=document.querySelector('.block[data-topic="stay"]');if(_stay)_stay.insertAdjacentHTML("beforeend",renderHotels());
  var _itin=document.querySelector('.block[data-topic="itin"]');if(_itin){var _h2=_itin.querySelector("h2");if(_h2)_h2.insertAdjacentHTML("afterend",'<p class="ssub" style="margin:8px 0 6px">Highlight aktiviti ikut kawasan</p>'+renderActs());}
  renderTabs();
  if(($("#q").value||"").trim())applyFilter();else showTopic(CURRENT);
}
function renderTabs(){
  const list=[{id:"all",t:"Overview"}].concat(TOPICS.filter(t=>document.querySelector('.block[data-topic="'+t.id+'"]')));
  $("#topicbar").innerHTML=list.map(t=>`<button class="tab${t.id===CURRENT?' active':''}" data-id="${t.id}" onclick="showTopic('${t.id}')">${esc(t.t)}</button>`).join("");
}
function showTopic(id){CURRENT=id;$("#q").value="";$("#q2").value="";
  document.querySelectorAll(".explore .tcard").forEach(c=>c.style.display="");
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  const all=id==="all";
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
  document.querySelectorAll(".explore").forEach(e=>e.classList.toggle("hidden",!all));
  document.querySelectorAll("#content .block").forEach(b=>b.classList.toggle("hidden",all||b.dataset.topic!==id));
  document.querySelectorAll("details.qa").forEach(d=>{d.classList.remove("hidden");d.open=false;});
  $("#noresult").style.display="none";
  if(all)window.scrollTo({top:0,behavior:"smooth"});
  else{const el=document.querySelector('.block[data-topic="'+id+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
}
function applyFilter(){
  const q=($("#q").value||"").trim().toLowerCase();
  if(!q){showTopic(CURRENT);return;}
  const av=$("#attractionview");if(av){av.classList.add("hidden");av.innerHTML="";}
  $("#topicbar").classList.remove("hidden");
  document.querySelectorAll("#topicbar .tab").forEach(b=>b.classList.remove("active"));
  let any=false;
  document.querySelectorAll("details.qa").forEach(d=>{const show=d.dataset.text.includes(q);d.classList.toggle("hidden",!show);d.open=show;if(show)any=true;});
  document.querySelectorAll("#content .block").forEach(b=>{
    const hasQA=!!b.querySelector("details.qa");
    const qaMatch=hasQA && b.querySelectorAll("details.qa:not(.hidden)").length>0;
    const textMatch=(b.textContent||"").toLowerCase().includes(q);
    const show=hasQA?(qaMatch||textMatch):textMatch;
    b.classList.toggle("hidden",!show); if(show)any=true;
  });
  document.querySelectorAll(".explore").forEach(sec=>{
    let secAny=false;
    sec.querySelectorAll(".tcard").forEach(c=>{const mm=(c.textContent||"").toLowerCase().includes(q);c.style.display=mm?"":"none";if(mm)secAny=true;});
    sec.classList.toggle("hidden",!secAny); if(secAny)any=true;
  });
  $("#noresult").style.display=any?"none":"block";
}
function sync(from,to){to.value=from.value;applyFilter();}
$("#q").addEventListener("input",()=>sync($("#q"),$("#q2")));
$("#q2").addEventListener("input",()=>sync($("#q2"),$("#q")));
$("#goBtn").addEventListener("click",()=>{applyFilter();});
build(KB.snapshot);
</script>
